<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Teste Clerk — Truta Escola</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #1F2937; }
  h1 { font-size: 20px; color: #1E3A8A; }
  #status { font-size: 13px; color: #6B7280; margin-bottom: 24px; }
  #app { border: 1px solid #E2E8F0; border-radius: 12px; padding: 24px; min-height: 120px; }
  pre { background: #F1F5F9; padding: 16px; border-radius: 8px; font-size: 12px; overflow-x: auto; }
</style>
</head>
<body>

  <h1>Teste isolado — Login Clerk (Truta Escola)</h1>
  <div id="status">A carregar o Clerk...</div>
  <div id="app"></div>

  <!-- SDK do Clerk, carregado directamente do domínio da aplicação -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_Y3V0ZS1zdW5iaXJkLTIyNDIuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cute-sunbird-2242.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script>
    window.addEventListener('load', async function () {
      const statusEl = document.getElementById('status');
      const appEl = document.getElementById('app');

      function renderSignedIn() {
        appEl.innerHTML = `
          <p><strong>Autenticado com sucesso.</strong></p>
          <pre id="user-data"></pre>
          <div id="user-button"></div>
        `;
        document.getElementById('user-data').textContent = JSON.stringify({
          id: Clerk.user.id,
          email: Clerk.user.primaryEmailAddress?.emailAddress,
          criado_em: Clerk.user.createdAt
        }, null, 2);
        Clerk.mountUserButton(document.getElementById('user-button'));
      }

      function renderSignIn() {
        appEl.innerHTML = '';
        Clerk.mountSignIn(appEl, {
          routing: 'virtual',
          fallbackRedirectUrl: window.location.href.split('#')[0]
        });
      }

      try {
        await Clerk.load();
        statusEl.textContent = 'Clerk carregado com sucesso.';

        // Reage sempre que o estado de autenticação mudar, sem depender de navegação/redirect
        Clerk.addListener(({ user }) => {
          if (user) {
            renderSignedIn();
          } else {
            renderSignIn();
          }
        });
      } catch (err) {
        statusEl.textContent = 'Erro ao carregar o Clerk — ver consola (F12).';
        console.error(err);
      }
    });
  </script>

</body>
</html>
